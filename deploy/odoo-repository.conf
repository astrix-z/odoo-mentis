[Service]
WorkingDirectory=/srv/odoo-mentis
Environment=PYTHONDONTWRITEBYTECODE=1
ExecStart=
ExecStart=/usr/bin/python3 /srv/odoo-mentis/scripts/odoo_entrypoint.py --config /etc/odoo/odoo.conf --logfile /var/log/odoo/odoo-server.log --addons-path /srv/odoo-mentis/source/odoo/addons,/srv/odoo-mentis/addons
