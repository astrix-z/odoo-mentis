name: odoo-mentis
services:
  db:
    image: postgres:15@sha256:c961aa287d8698297cb26cdfadfbe9fd2cbaf77e53cfffe9636e8d8a1e4d842c
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U odoo -d postgres']
      interval: 3s
      timeout: 3s
      retries: 20
  odoo:
    image: odoo-mentis-dev:16.0
    build: ./docker
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    command: [odoo, -c, /etc/odoo/odoo.conf, "--dev=reload,qweb,xml"]
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8069/web/login", timeout=5).read()']
      interval: 10s
      timeout: 8s
      start_period: 30s
      retries: 12
    volumes:
      - ./source/odoo:/usr/lib/python3/dist-packages/odoo:z
      - ./addons:/mnt/extra-addons:z
      - ./.local/odoo.conf:/etc/odoo/odoo.conf:ro,z
      - odoo-data:/var/lib/odoo
    networks: [isolated]
  web:
    image: nginx:alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    depends_on:
      odoo:
        condition: service_healthy
        restart: true
    ports:
      - '127.0.0.1:8069:80'
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    networks: [frontend, isolated]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/web/login]
      interval: 10s
      timeout: 8s
      retries: 12
volumes:
  pgdata:
  odoo-data:
networks:
  frontend:
  isolated:
    internal: true
